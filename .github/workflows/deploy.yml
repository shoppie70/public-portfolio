# スターサーバー自動FTPデプロイ ワークフロー
# main ブランチへのPush時に自動でビルド＆デプロイを実行します

name: Deploy to Star Server via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy site via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 最新コードの取得
        uses: actions/checkout@v4

      - name: 🔧 Node.js 22.x のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 依存パッケージのインストール
        run: npm ci

      - name: 🏗️ 静的ファイルのビルド
        run: npm run build

      # 安全な .env の生成方法（インジェクション対策）
      - name: 🔑 本番用 .env ファイルの自動生成
        env:
          SECRET_VAL: ${{ secrets.TURNSTILE_SECRET }}
          EMAIL_VAL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          # ADMIN_EMAIL が未設定の場合はデフォルト値を使用
          FINAL_EMAIL="${EMAIL_VAL:-contact@sho-tsukamoto.jp}"
          
          # 環境変数経由で安全にファイルに書き出す
          echo "TURNSTILE_SECRET=${SECRET_VAL}" > ./dist/api/.env
          echo "ADMIN_EMAIL=${FINAL_EMAIL}" >> ./dist/api/.env

      - name: ⚙️ サーバーディレクトリパスの自動調整
        env:
          SECRET_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          DIR="$SECRET_DIR"
          if [ -z "$DIR" ]; then
            DIR="/"
          elif [[ "$DIR" != */ ]]; then
            DIR="${DIR}/"
          fi
          echo "SERVER_DIR=${DIR}" >> $GITHUB_ENV

      - name: 📂 FTPによるスターサーバーへの同期アップロード
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.SERVER_DIR }}
          local-dir: ./dist/
          dangerous-clean-slate: false
