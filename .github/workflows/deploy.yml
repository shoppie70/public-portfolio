# スターサーバー自動FTPデプロイ ワークフロー
# main ブランチへのPush時に自動でビルド＆デプロイを実行します

name: Deploy to Star Server via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy site via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 最新コードの取得
        uses: actions/checkout@v4

      - name: 🔧 Node.js 22.x のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 依存パッケージのインストール
        run: npm ci

      - name: 🏗️ 静的ファイルのビルド
        run: npm run build

      - name: 🔑 本番用 .env ファイルの自動生成
        run: |
          cat << EOF > ./dist/api/.env
          TURNSTILE_SECRET=${{ secrets.TURNSTILE_SECRET }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL || 'contact@sho-tsukamoto.jp' }}
          EOF

      - name: ⚙️ サーバーディレクトリパスの自動調整（末尾スラッシュ補正）
        run: |
          DIR="${{ secrets.FTP_SERVER_DIR }}"
          if [ -z "$DIR" ]; then
            DIR="/"
          elif [[ "$DIR" != */ ]]; then
            DIR="${DIR}/"
          fi
          echo "SERVER_DIR=${DIR}" >> $GITHUB_ENV

      - name: 📂 FTPによるスターサーバーへの同期アップロード
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.SERVER_DIR }}
          local-dir: ./dist/
          dangerous-clean-slate: false
