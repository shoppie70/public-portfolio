# スターサーバー自動FTPデプロイ ワークフロー
# main ブランチへのPush時に自動でビルド＆デプロイを実行します

name: Deploy to Star Server via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy site via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 最新コードの取得
        uses: actions/checkout@v4

      - name: 🔧 Node.js 20.x のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 依存パッケージのインストール
        run: npm ci

      - name: 🏗️ 静的ファイルのビルド
        run: npm run build

      - name: 📂 FTPによるスターサーバーへの同期アップロード
        uses: SamKirland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          local-dir: ./dist/
          dangerous-clean-slate: false
