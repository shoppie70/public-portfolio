<!-- Modal: 前田杯 -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none;"
    x-show="activeProject === 'maedahai'" x-transition.opacity.duration.300ms>
    <div class="fixed inset-0 bg-black/80 backdrop-blur-sm" @click="activeProject = null"></div>
    <div class="relative w-full max-w-4xl bg-zinc-900/85 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-6 md:p-10 max-h-[90vh] overflow-y-auto text-zinc-100"
        x-show="activeProject === 'maedahai'"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95">
        <button
            class="absolute top-4 right-4 text-zinc-400 hover:text-white bg-zinc-800 hover:bg-zinc-700 w-8 h-8 rounded-full flex items-center justify-center transition-colors"
            @click="activeProject = null">✕</button>
        <div class="mt-4 space-y-6">
            <div>
                <h3 class="text-2xl font-bold text-white mb-2 font-heading">
                    前田杯 釣り大会システム
                </h3>
                <div class="text-base text-zinc-300 space-y-5 leading-loose">
                    <p>
                        有志で企画・運営している釣り大会の公式サイトおよび応募エントリー管理システムです。
                    </p>
                    <p>
                        バックエンドおよび応募受付のロジックはLaravelを用いて構築。管理画面からエントリーした応募者のステータス確認、名簿作成などがスムーズに行える設計にしています。
                    </p>
                    <div class="pt-4 border-t border-zinc-800">
                        <p class="text-sm text-zinc-300 mb-1">GitHub Repository</p>
                        <a class="text-blue-400 hover:underline text-sm"
                            href="https://github.com/shoppie70/FishingTournamentEntryForm"
                            target="_blank" rel="noopener">
                            https://github.com/shoppie70/FishingTournamentEntryForm
                        </a>
                    </div>
                </div>
            </div>
            <div class="rounded-xl overflow-hidden border border-zinc-800 max-w-2xl mx-auto">
                <img loading="lazy" decoding="async" class="w-full object-cover" src="./assets/images/maedahai.jpg"
                    alt="前田杯 Screenshot">
            </div>
        </div>
    </div>
</div>
