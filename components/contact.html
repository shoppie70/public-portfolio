<section id="contact" class="px-4 py-12 bg-zinc-950 border-t border-zinc-800 md:px-0 md:py-32">
    <div class="mx-auto max-w-screen-lg">
        <div class="mb-10 md:mb-16">
            <div class="wow animate__ animate__fadeInUp">
                <h2 class="text-3xl sm:text-5xl md:text-7xl font-bold text-white tracking-wider font-heading">
                    CONTACT
                </h2>
                <div class="h-1 w-12 bg-blue-600 mt-2"></div>
            </div>
        </div>

        <div class="wow animate__ animate__fadeInUp" data-wow-delay="0.1s" x-data="contactForm()">
            <div class="max-w-2xl mx-auto">

                <!-- フォームメインコンテナ -->
                <div class="p-6 md:p-10 bg-zinc-900/40 rounded-2xl border border-zinc-800 relative overflow-hidden">
                    <!-- 背景グラデーション装飾 -->
                    <div class="absolute -right-20 -top-20 w-80 h-80 rounded-full pointer-events-none"
                        style="background: radial-gradient(circle, rgba(37,99,235,0.08) 0%, transparent 70%);"></div>

                    <div class="relative">
                        <p class="text-blue-500 font-semibold tracking-widest text-xs uppercase mb-2">GET IN TOUCH</p>
                        <h3 class="text-2xl md:text-3xl font-bold text-white mb-3 font-heading">
                            お問い合わせ
                        </h3>
                        <p class="text-zinc-300 text-sm leading-relaxed mb-8">
                            採用・業務委託・副業のご相談、Webシステム開発のご依頼など、お気軽にご連絡ください。<br>
                            直送メール（<a href="mailto:contact@sho-tsukamoto.jp" class="text-blue-400 underline hover:text-blue-300">contact@sho-tsukamoto.jp</a>）でのご連絡も承っております。
                        </p>

                        <!-- 送信完了メッセージ -->
                        <div x-show="submitted" x-collapse style="display: none;" class="mb-6 p-6 rounded-xl bg-blue-900/20 border border-blue-500/40 text-center">
                            <div class="w-12 h-12 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center mx-auto mb-3 text-xl">
                                ✓
                            </div>
                            <h4 class="text-lg font-bold text-white mb-2">送信が完了いたしました</h4>
                            <p class="text-xs text-zinc-300 leading-relaxed mb-4" x-text="serverMessage"></p>
                            <button @click="resetForm()" class="text-xs text-blue-400 hover:text-blue-300 underline font-semibold">
                                別の内容を送信する
                            </button>
                        </div>

                        <!-- お問い合わせフォーム -->
                        <form x-show="!submitted" @submit.prevent="submitForm()" class="space-y-5">
                            <!-- ハニーポット（スパム用隠しフィールド） -->
                            <input type="text" name="hp_website" x-model="formData.hp_website" style="display: none;" tabindex="-1" autocomplete="off">

                            <!-- エラー表示 -->
                            <div x-show="errorMessage" x-collapse style="display: none;" class="p-4 rounded-lg bg-red-900/30 border border-red-500/40 text-red-300 text-xs">
                                <span x-text="errorMessage"></span>
                            </div>

                            <!-- お名前 -->
                            <div>
                                <label class="block text-sm font-semibold text-zinc-300 mb-1.5" for="contact-name">
                                    お名前 <span class="text-red-400">*</span>
                                </label>
                                <input type="text" id="contact-name" x-model="formData.name" required
                                    placeholder="例）山田 太郎"
                                    class="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-white text-sm focus:outline-none focus:border-blue-500 transition-colors duration-200">
                            </div>

                            <!-- メールアドレス -->
                            <div>
                                <label class="block text-sm font-semibold text-zinc-300 mb-1.5" for="contact-email">
                                    メールアドレス <span class="text-red-400">*</span>
                                </label>
                                <input type="email" id="contact-email" x-model="formData.email" required
                                    placeholder="例）yourname@example.com"
                                    class="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-white text-sm focus:outline-none focus:border-blue-500 transition-colors duration-200">
                            </div>

                            <!-- 種別 -->
                            <div>
                                <label class="block text-sm font-semibold text-zinc-300 mb-1.5" for="contact-type">
                                    お問い合わせ種別
                                </label>
                                <select id="contact-type" x-model="formData.type"
                                    class="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-white text-sm focus:outline-none focus:border-blue-500 transition-colors duration-200">
                                    <option value="採用・転職のご相談">🤝 採用・転職のご相談</option>
                                    <option value="Webシステム・アプリ開発のご依頼">💻 Webシステム・アプリ開発のご依頼</option>
                                    <option value="副業・業務委託のご相談">⚡ 副業・業務委託のご相談</option>
                                    <option value="その他">💬 その他のお問い合わせ</option>
                                </select>
                            </div>

                            <!-- メッセージ内容 -->
                            <div>
                                <label class="block text-sm font-semibold text-zinc-300 mb-1.5" for="contact-message">
                                    お問い合わせ内容 <span class="text-red-400">*</span>
                                </label>
                                <textarea id="contact-message" x-model="formData.message" required rows="5"
                                    placeholder="お問い合わせ内容をご記入ください。"
                                    class="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-white text-sm focus:outline-none focus:border-blue-500 transition-colors duration-200 leading-relaxed"></textarea>
                            </div>

                            <!-- Cloudflare Turnstile ウィジェット -->
                            <div class="py-2">
                                <div class="cf-turnstile" data-sitekey="0x4AAAAAAEBuQO3IRwx2kTgz" data-action="turnstile-spin-v2" data-theme="dark"></div>
                            </div>

                            <!-- 送信ボタン -->
                            <button type="submit" :disabled="loading"
                                class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold text-sm tracking-wider transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-900/30 cursor-pointer">
                                <template x-if="!loading">
                                    <span class="flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                                        </svg>
                                        送信する
                                    </span>
                                </template>
                                <template x-if="loading">
                                    <span class="flex items-center gap-2">
                                        <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        送信中...
                                    </span>
                                </template>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- SNS/リンク -->
                <div class="mt-8 flex items-center justify-center gap-6">
                    <a href="https://github.com/shoppie70" target="_blank" rel="noopener"
                        class="inline-flex items-center gap-2 text-sm text-zinc-500 hover:text-white transition-colors duration-200">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path fill-rule="evenodd"
                                d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                                clip-rule="evenodd" />
                        </svg>
                        GitHub
                    </a>
                    <span class="text-zinc-700">|</span>
                    <a href="https://hackmd.io/@sho-tsukamoto/CV" target="_blank" rel="noopener"
                        class="inline-flex items-center gap-2 text-sm text-zinc-500 hover:text-white transition-colors duration-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        職務経歴書（CV）
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('contactForm', () => ({
        formData: {
            name: '',
            email: '',
            type: '採用・転職のご相談',
            message: '',
            hp_website: ''
        },
        loading: false,
        submitted: false,
        errorMessage: '',
        serverMessage: '',

        async submitForm() {
            this.loading = true;
            this.errorMessage = '';

            // Turnstile トークンの取得
            const turnstileInput = document.querySelector('[name="cf-turnstile-response"]');
            const token = turnstileInput ? turnstileInput.value : '';

            try {
                const response = await fetch('/api/contact.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        ...this.formData,
                        cf_turnstile_response: token
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    this.submitted = true;
                    this.serverMessage = result.message || '送信が完了しました。';
                } else {
                    this.errorMessage = result.message || '送信に失敗しました。時間をおいて再度お試しください。';
                }
            } catch (err) {
                console.error('Contact Form Error:', err);
                this.errorMessage = '通信エラーが発生しました。インターネット接続をご確認の上、直接 contact@sho-tsukamoto.jp へメールでお問い合わせください。';
            } finally {
                this.loading = false;
            }
        },

        resetForm() {
            this.formData = {
                name: '',
                email: '',
                type: '採用・転職のご相談',
                message: '',
                hp_website: ''
            };
            this.submitted = false;
            this.errorMessage = '';
            this.serverMessage = '';
            if (window.turnstile) {
                window.turnstile.reset();
            }
        }
    }));
});
</script>
